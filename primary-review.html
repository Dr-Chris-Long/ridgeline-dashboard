<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>RIDGELINE — Primary Review Dashboard</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
:root{--bg:#0B0F19;--sf:#131825;--sh:#1A2035;--bd:#1E2A42;--bl:#2A3A5C;--tx:#E2E8F0;--tm:#8896B3;--td:#5A6A8A;--ac:#4F8EF7;--gn:#34D399;--yw:#FBBF24;--rd:#F87171;--gy:#8896B3;--pp:#A78BFA;--mono:'JetBrains Mono',monospace}
*{margin:0;padding:0;box-sizing:border-box}body{font-family:'IBM Plex Sans',system-ui,sans-serif;background:var(--bg);color:var(--tx);display:flex;min-height:100vh}
::-webkit-scrollbar{width:6px;height:6px}::-webkit-scrollbar-track{background:var(--bg)}::-webkit-scrollbar-thumb{background:var(--bl);border-radius:3px}
.sb{width:220px;background:var(--sf);border-right:1px solid var(--bd);display:flex;flex-direction:column;position:sticky;top:0;height:100vh;flex-shrink:0}
.sb-b{padding:20px 16px;border-bottom:1px solid var(--bd)}.sb-b a{text-decoration:none;color:var(--ac);font-size:11px;display:block;margin-bottom:8px}.sb-b h1{font-size:14px;color:var(--ac);letter-spacing:.04em}.sb-b p{font-size:11px;color:var(--td);margin-top:4px}
.sb-n{padding:12px 8px;display:flex;flex-direction:column;gap:2px}
.nb{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:6px;border:none;cursor:pointer;font-size:13px;background:transparent;color:var(--tm);width:100%;text-align:left;font-family:inherit}
.nb:hover{background:var(--sh)}.nb.a{background:rgba(79,142,247,.1);color:var(--ac);font-weight:600}
.sf{margin-top:auto;padding:12px 16px;border-top:1px solid var(--bd);font-size:10px;color:var(--td)}
.mn{flex:1;padding:28px;overflow-y:auto;min-width:0}.ct{max-width:1200px;margin:0 auto}
.pt{font-size:22px;font-weight:700;margin-bottom:4px}.ps{font-size:12px;color:var(--td);margin-bottom:24px}
.g5{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:16px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:16px}@media(max-width:900px){.g2{grid-template-columns:1fr}}
.cd{background:var(--sf);border:1px solid var(--bd);border-radius:8px;padding:20px}
.sl{font-size:11px;color:var(--tm);text-transform:uppercase;letter-spacing:.08em;margin-bottom:8px}
.sv{font-size:32px;font-weight:700;line-height:1;font-family:var(--mono)}
.ss{font-size:12px;color:var(--td);margin-top:6px}
.ct2{font-size:13px;font-weight:600;margin-bottom:16px}
.bg{display:inline-block;padding:2px 8px;border-radius:4px;font-size:11px;font-weight:600;letter-spacing:.03em}
.tb{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-bottom:16px}
.tb input,.tb select{padding:8px 12px;border-radius:6px;border:1px solid var(--bd);background:var(--sf);color:var(--tx);font-size:13px;outline:none;font-family:inherit}
.tb input:focus,.tb select:focus{border-color:var(--ac)}.tc{font-size:12px;color:var(--td);margin-left:auto}
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;padding:10px 14px;background:var(--sh);color:var(--tm);font-size:11px;text-transform:uppercase;letter-spacing:.06em;border-bottom:1px solid var(--bd);position:sticky;top:0;white-space:nowrap}
td{padding:10px 14px;border-bottom:1px solid var(--bd)}
tr.ck{cursor:pointer}tr.ck:hover{background:var(--sh)}
.tw{overflow:auto;max-height:620px;border-radius:6px;border:1px solid var(--bd)}
.wp{max-width:460px;white-space:normal;line-height:1.5}
.bk{background:none;border:none;color:var(--ac);cursor:pointer;font-size:13px;padding:0;margin-bottom:16px}.bk:hover{text-decoration:underline}
.ch{height:280px;position:relative}.ch-lg{height:360px;position:relative}
.fl{display:flex;flex-direction:column;gap:20px}
.kv{font-size:11px;color:var(--td);text-transform:uppercase;letter-spacing:.05em;margin-top:14px}
.kt{font-size:13px;color:var(--tx);margin-top:5px;line-height:1.6;white-space:pre-wrap}
.banner{background:rgba(79,142,247,.08);border:1px solid var(--bd);border-radius:6px;padding:10px 14px;font-size:12px;color:var(--tm);margin-bottom:18px;line-height:1.5}
</style>
</head>
<body>
<div class="sb">
  <div class="sb-b"><a href="index.html">&larr; RIDGELINE Home</a><h1>RIDGELINE</h1><p>Primary Review</p></div>
  <div class="sb-n" id="nav"></div>
  <div class="sf" id="ft">Loading&hellip;</div>
</div>
<div class="mn"><div class="ct">
  <h2 class="pt" id="ttl">Overview</h2>
  <div class="ps">Adversarial NEPA compliance review &middot; Last Chance FMP &middot; BLM Medford District</div>
  <div id="con"><p style="text-align:center;padding:60px;color:var(--tm)">Connecting to Supabase&hellip;</p></div>
</div></div>
<script>
const SB_URL="https://uojjoraxzmzwuilmndlu.supabase.co/rest/v1";
const SB_KEY="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InVvampvcmF4em16d3VpbG1uZGx1Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzI1ODc4MTksImV4cCI6MjA4ODE2MzgxOX0.4WmtuoXjXj441KpbLxJkQTebulejiEafKu0bSvdefpM";
const RUN="2822839a-edf8-42b0-a1a2-d5d9b398b221";
const HDRS={apikey:SB_KEY,Authorization:`Bearer ${SB_KEY}`};
const SEVC={RED:"#F87171",YELLOW:"#FBBF24",GREEN:"#34D399",GRAY:"#8896B3"};
let F=[],C=[],charts=[];
const $=id=>document.getElementById(id);
function h(t,a,...c){const e=document.createElement(t);if(a)Object.entries(a).forEach(([k,v])=>{if(k==="style"&&typeof v==="object")Object.assign(e.style,v);else if(k.startsWith("on"))e.addEventListener(k.slice(2).toLowerCase(),v);else if(k==="className")e.className=v;else if(k==="html")e.innerHTML=v;else e.setAttribute(k,v)});c.flat().forEach(x=>{if(x!=null)e.append(typeof x==="object"?x:document.createTextNode(String(x)))});return e}
function bg(t,c){return h("span",{className:"bg",style:{color:c,background:c+"20"}},t)}
function sev(s){return bg(s||"—",SEVC[s]||"#8896B3")}
function sc(l,v,s,c){return h("div",{className:"cd"},h("div",{className:"sl"},l),h("div",{className:"sv",style:{color:c||"var(--ac)"}},String(v)),s?h("div",{className:"ss"},s):null)}
function dc(){charts.forEach(c=>c.destroy());charts=[]}
function mc(cv,t,cfg){const c=new Chart(cv.getContext("2d"),{type:t,...cfg,options:{...cfg.options,responsive:true,maintainAspectRatio:false,plugins:{...cfg.options?.plugins,legend:{labels:{color:"#8896B3",font:{size:11}},...cfg.options?.plugins?.legend},tooltip:{backgroundColor:"#131825",borderColor:"#2A3A5C",borderWidth:1,titleColor:"#E2E8F0",bodyColor:"#8896B3",padding:10}},scales:["pie","doughnut"].includes(t)?undefined:{x:{ticks:{color:"#5A6A8A",font:{size:11}},grid:{color:"#1E2A42"},...cfg.options?.scales?.x},y:{ticks:{color:"#5A6A8A",font:{size:11}},grid:{color:"#1E2A42"},...cfg.options?.scales?.y}}}});charts.push(c);return c}
function bt(cols,data,oc){const w=h("div",{className:"tw"});const tb=h("table");const th=h("thead",null,h("tr",null,...cols.map(c=>h("th",null,c.l))));const bd=h("tbody");(data||[]).forEach(r=>{const tr=h("tr",oc?{className:"ck",onClick:()=>oc(r)}:null);cols.forEach(c=>{const td=h("td",c.w?{className:"wp"}:null);const v=c.r?c.r(r):(r[c.k]??"—");if(v&&v.nodeType)td.appendChild(v);else td.textContent=v;tr.appendChild(td)});bd.appendChild(tr)});tb.append(th,bd);w.appendChild(tb);return w}
async function fetchAll(t,q){let a=[],o=0;while(true){const r=await fetch(`${SB_URL}/${t}?${q}&limit=1000&offset=${o}`,{headers:HDRS});if(!r.ok)throw new Error(t+": "+r.status);const d=await r.json();a=a.concat(d);if(d.length<1000)break;o+=1000}return a}
async function load(){
  const fsel="select=finding_id,project_code,primary_category,attack_category,obligation_name,compliance_question,plaintiff_severity,plaintiff_confidence,plaintiff_argument,defense_verdict,defense_confidence,defense_argument,arbiter_invoked,arbiter_final_severity,arbiter_explanation,final_severity,final_disposition,threat_score_final,fix_recommendation,fix_difficulty,residual_risk,pi_vulnerability_score,human_reviewed,human_disposition,human_notes";
  const csel="select=chain_id,chain_name,chain_description,member_findings,finding_count,cascade_type,root_finding_id,terminal_finding_id,amplified_severity,threat_level,mechanism,fix_strategy,vacatur_risk,litigation_pattern,amplification_rationale,litigation_strategy_note";
  [F,C]=await Promise.all([fetchAll("primary_review_findings",`${fsel}&run_id=eq.${RUN}`),fetchAll("cascade_chains",`${csel}&run_id=eq.${RUN}`)]);
  $("ft").textContent=`${F.length} findings · ${C.length} cascades · run ${RUN.slice(0,8)}`;
}
function grp(arr,k){const m={};arr.forEach(x=>{const v=x[k]||"—";m[v]=(m[v]||0)+1});return Object.fromEntries(Object.entries(m).sort((a,b)=>b[1]-a[1]))}
function rOv(){dc();const f=h("div",{className:"fl"});
  const rc=s=>F.filter(x=>x.final_severity===s).length;
  f.appendChild(h("div",{className:"banner"},"Multi-model adversarial review (plaintiff / defense / arbiter) of the Last Chance EA against the RIDGELINE obligation-cluster library. Pre-decisional internal analysis — not a legal opinion. Every finding requires human review."));
  const s=h("div",{className:"g5"});
  s.append(sc("Findings",F.length,"this run"),sc("RED",rc("RED"),"high exposure",SEVC.RED),sc("YELLOW",rc("YELLOW"),"moderate",SEVC.YELLOW),sc("GREEN",rc("GREEN"),"defensible",SEVC.GREEN),sc("GRAY",rc("GRAY"),"indeterminate",SEVC.GRAY));
  f.appendChild(s);
  const s2=h("div",{className:"g5"});
  const hr=F.filter(x=>x.human_reviewed).length;
  const casc=F.filter(x=>x.arbiter_invoked).length;
  s2.append(sc("Cascade chains",C.length,"linked failure paths","#A78BFA"),sc("Arbiter invoked",casc,"split decisions"),sc("Human-reviewed",hr,hr+" of "+F.length+" dispositioned",hr?SEVC.GREEN:SEVC.GRAY));
  f.appendChild(s2);
  const r1=h("div",{className:"g2"});
  const c1c=h("div",{className:"cd"});c1c.append(h("div",{className:"ct2"},"By resource category"));const c1=h("canvas");c1c.append(h("div",{className:"ch-lg"},c1));r1.appendChild(c1c);
  const c2c=h("div",{className:"cd"});c2c.append(h("div",{className:"ct2"},"Severity distribution"));const c2=h("canvas");c2c.append(h("div",{className:"ch-lg"},c2));r1.appendChild(c2c);
  f.appendChild(r1);
  const r2=h("div",{className:"g2"});
  const c3c=h("div",{className:"cd"});c3c.append(h("div",{className:"ct2"},"By attack theory"));const c3=h("canvas");c3c.append(h("div",{className:"ch"},c3));r2.appendChild(c3c);
  const c4c=h("div",{className:"cd"});c4c.append(h("div",{className:"ct2"},"RED findings by category"));const c4=h("canvas");c4c.append(h("div",{className:"ch"},c4));r2.appendChild(c4c);
  f.appendChild(r2);
  $("con").replaceChildren(f);
  const byCat=grp(F,"primary_category");
  mc(c1,"bar",{data:{labels:Object.keys(byCat),datasets:[{data:Object.values(byCat),backgroundColor:"#4F8EF7",borderRadius:4}]},options:{indexAxis:"y",plugins:{legend:{display:false}}}});
  mc(c2,"doughnut",{data:{labels:["RED","YELLOW","GREEN","GRAY"],datasets:[{data:["RED","YELLOW","GREEN","GRAY"].map(rc),backgroundColor:["RED","YELLOW","GREEN","GRAY"].map(s=>SEVC[s])}]},options:{cutout:"55%",plugins:{legend:{position:"right"}}}});
  const byAtk=grp(F,"attack_category");
  mc(c3,"bar",{data:{labels:Object.keys(byAtk),datasets:[{data:Object.values(byAtk),backgroundColor:"#A78BFA",borderRadius:4}]},options:{indexAxis:"y",plugins:{legend:{display:false}}}});
  const redByCat=grp(F.filter(x=>x.final_severity==="RED"),"primary_category");
  mc(c4,"bar",{data:{labels:Object.keys(redByCat),datasets:[{data:Object.values(redByCat),backgroundColor:"#F87171",borderRadius:4}]},options:{indexAxis:"y",plugins:{legend:{display:false}}}});
}
function f_block(label,text,color){const wrap=h("div");wrap.append(h("div",{className:"kv",style:{color:color||"var(--tm)"}},label),h("div",{className:"kt"},text||"—"));return wrap}
function rFi(det){dc();const f=h("div",{className:"fl"});
  if(det){
    f.appendChild(h("button",{className:"bk",onClick:()=>rFi()},"\u2190 Back to findings"));
    const c=h("div",{className:"cd"});
    c.append(h("div",{style:{display:"flex",justifyContent:"space-between",alignItems:"flex-start",gap:"12px",flexWrap:"wrap"}},
      h("div",{style:{fontSize:"17px",fontWeight:700,maxWidth:"720px"}},det.obligation_name||det.finding_id),
      h("div",{style:{display:"flex",gap:"6px",flexWrap:"wrap"}},sev(det.final_severity),det.primary_category?bg(det.primary_category,"#4F8EF7"):null,det.attack_category?bg(det.attack_category,"#A78BFA"):null)));
    const meta=h("div",{style:{display:"flex",gap:"18px",marginTop:"12px",flexWrap:"wrap",fontSize:"12px",color:"var(--tm)"}});
    meta.append(h("span",null,"ID: "+det.finding_id),h("span",null,"Threat: "+(det.threat_score_final??"—")),h("span",null,"PI-vuln: "+(det.pi_vulnerability_score??"—")),h("span",null,"Fix difficulty: "+(det.fix_difficulty||"—")),h("span",null,"Disposition: "+(det.final_disposition||"—")));
    c.appendChild(meta);
    if(det.compliance_question){c.append(h("div",{className:"kv"},"Compliance question"),h("div",{className:"kt"},det.compliance_question))}
    c.appendChild(f_block("Plaintiff argument ("+(det.plaintiff_severity||"?")+", conf "+(det.plaintiff_confidence??"?")+")",det.plaintiff_argument,SEVC.RED));
    c.appendChild(f_block("Defense ("+(det.defense_verdict||"?")+", conf "+(det.defense_confidence??"?")+")",det.defense_argument,SEVC.GREEN));
    if(det.arbiter_invoked)c.appendChild(f_block("Arbiter ("+(det.arbiter_final_severity||"?")+")",det.arbiter_explanation,"#A78BFA"));
    if(det.residual_risk)c.append(h("div",{className:"kv"},"Residual risk"),h("div",{className:"kt"},det.residual_risk));
    if(det.fix_recommendation)c.append(h("div",{className:"kv",style:{color:"var(--ac)"}},"Fix recommendation"),h("div",{className:"kt"},det.fix_recommendation));
    if(det.human_reviewed)c.append(h("div",{className:"kv",style:{color:"var(--gn)"}},"Human review — "+(det.human_disposition||"reviewed")),det.human_notes?h("div",{className:"kt"},det.human_notes):h("span"));
    f.appendChild(c);$("con").replaceChildren(f);$("ttl").textContent=det.finding_id;return;
  }
  const tb=h("div",{className:"tb"});
  const si=h("input",{type:"text",placeholder:"Search obligation, question, argument...",style:{width:"300px"}});
  const cat=h("select");cat.append(h("option",{value:"all"},"All categories"));[...new Set(F.map(x=>x.primary_category).filter(Boolean))].sort().forEach(v=>cat.append(h("option",{value:v},v)));
  const sevf=h("select");sevf.append(h("option",{value:"all"},"All severities"),...["RED","YELLOW","GREEN","GRAY"].map(s=>h("option",{value:s},s)));
  const atk=h("select");atk.append(h("option",{value:"all"},"All attack theories"));[...new Set(F.map(x=>x.attack_category).filter(Boolean))].sort().forEach(v=>atk.append(h("option",{value:v},v)));
  const cnt=h("div",{className:"tc"});
  tb.append(si,cat,sevf,atk,cnt);f.appendChild(tb);
  const tc=h("div");f.appendChild(tc);
  function rf(){
    const s=si.value.toLowerCase(),cf=cat.value,sf=sevf.value,af=atk.value;
    const fl=F.filter(x=>{
      if(cf!=="all"&&x.primary_category!==cf)return false;
      if(sf!=="all"&&x.final_severity!==sf)return false;
      if(af!=="all"&&x.attack_category!==af)return false;
      if(s)return[x.obligation_name,x.compliance_question,x.plaintiff_argument,x.fix_recommendation].some(v=>(v||"").toLowerCase().includes(s));
      return true;
    }).sort((a,b)=>(b.threat_score_final||0)-(a.threat_score_final||0));
    cnt.textContent=fl.length+" of "+F.length;
    tc.replaceChildren(bt([
      {l:"Sev",k:"final_severity",r:r=>sev(r.final_severity)},
      {l:"Category",k:"primary_category"},
      {l:"Obligation",k:"obligation_name",w:1},
      {l:"Attack",k:"attack_category",r:r=>r.attack_category?bg(r.attack_category,"#A78BFA"):"—"},
      {l:"Threat",k:"threat_score_final",r:r=>h("span",{style:{fontFamily:"var(--mono)"}},r.threat_score_final??"—")},
      {l:"HR",k:"human_reviewed",r:r=>r.human_reviewed?bg("\u2713","#34D399"):""}
    ],fl,r=>rFi(r)));
  }
  [si,cat,sevf,atk].forEach(el=>el.addEventListener(el.tagName==="INPUT"?"input":"change",rf));
  $("con").replaceChildren(f);rf();
}
function rCa(det){dc();const f=h("div",{className:"fl"});
  if(det){
    f.appendChild(h("button",{className:"bk",onClick:()=>rCa()},"\u2190 Back to cascades"));
    const c=h("div",{className:"cd"});
    c.append(h("div",{style:{display:"flex",justifyContent:"space-between",alignItems:"flex-start",gap:"12px",flexWrap:"wrap"}},
      h("div",{style:{fontSize:"17px",fontWeight:700,maxWidth:"720px"}},det.chain_name||det.chain_id),
      h("div",{style:{display:"flex",gap:"6px",flexWrap:"wrap"}},sev(det.amplified_severity),det.threat_level?bg(det.threat_level,"#FB923C"):null,bg((det.finding_count||(det.member_findings||[]).length)+" findings","#4F8EF7"))));
    if(det.chain_description)c.append(h("div",{className:"kt",style:{marginTop:"12px"}},det.chain_description));
    if(det.mechanism)c.append(h("div",{className:"kv"},"Mechanism"),h("div",{className:"kt"},det.mechanism));
    if(det.litigation_pattern)c.append(h("div",{className:"kv"},"Litigation pattern"),h("div",{className:"kt"},det.litigation_pattern));
    if(det.vacatur_risk)c.append(h("div",{className:"kv"},"Vacatur risk"),h("div",{className:"kt"},det.vacatur_risk));
    if(det.amplification_rationale)c.append(h("div",{className:"kv"},"Amplification rationale"),h("div",{className:"kt"},det.amplification_rationale));
    if(det.fix_strategy)c.append(h("div",{className:"kv",style:{color:"var(--ac)"}},"Fix strategy"),h("div",{className:"kt"},det.fix_strategy));
    const mem=(det.member_findings||[]).map(id=>F.find(x=>x.finding_id===id)).filter(Boolean);
    if(mem.length){const mc2=h("div",{className:"cd",style:{marginTop:"16px"}});mc2.append(h("div",{className:"ct2"},"Member findings ("+mem.length+")"));mc2.appendChild(bt([{l:"Sev",k:"final_severity",r:r=>sev(r.final_severity)},{l:"Category",k:"primary_category"},{l:"Obligation",k:"obligation_name",w:1}],mem,r=>{sv("findings");setTimeout(()=>rFi(r),40)}));f.append(c,mc2)}else f.appendChild(c);
    $("con").replaceChildren(f);$("ttl").textContent=det.chain_name||det.chain_id;return;
  }
  f.appendChild(h("div",{className:"banner"},"Cascade chains link individual findings into compounding failure paths where one defect amplifies the litigation exposure of others."));
  const grid=h("div",{style:{display:"grid",gridTemplateColumns:"repeat(auto-fit,minmax(320px,1fr))",gap:"16px"}});
  C.sort((a,b)=>(b.finding_count||0)-(a.finding_count||0)).forEach(ch=>{
    const card=h("div",{className:"cd",style:{cursor:"pointer"},onClick:()=>rCa(ch),onMouseenter:e=>e.currentTarget.style.borderColor="var(--ac)",onMouseleave:e=>e.currentTarget.style.borderColor="var(--bd)"});
    card.append(h("div",{style:{display:"flex",justifyContent:"space-between",alignItems:"flex-start",gap:"8px",marginBottom:"8px"}},h("div",{style:{fontSize:"14px",fontWeight:700}},ch.chain_name||ch.chain_id),sev(ch.amplified_severity)),
      h("div",{style:{fontSize:"12px",color:"var(--tm)",lineHeight:"1.5",maxHeight:"60px",overflow:"hidden"}},ch.chain_description||ch.mechanism||""),
      h("div",{style:{display:"flex",gap:"6px",marginTop:"10px",flexWrap:"wrap"}},bg((ch.finding_count||(ch.member_findings||[]).length)+" findings","#4F8EF7"),ch.threat_level?bg(ch.threat_level,"#FB923C"):null,ch.cascade_type?bg(ch.cascade_type,"#A78BFA"):null));
    grid.appendChild(card);
  });
  f.appendChild(grid);$("con").replaceChildren(f);
}
const VW=[{id:"overview",l:"Overview",ic:"\u25C9",fn:rOv},{id:"findings",l:"Findings",ic:"\u25C8",fn:rFi},{id:"cascades",l:"Cascades",ic:"\u25C7",fn:rCa}];
let cv="overview";
function sv(id){cv=id;document.querySelectorAll(".nb").forEach(b=>b.classList.toggle("a",b.dataset.v===id));$("ttl").textContent=VW.find(v=>v.id===id).l;VW.find(v=>v.id===id).fn()}
const nav=$("nav");VW.forEach(v=>{const b=h("button",{className:"nb"+(v.id==="overview"?" a":""),"data-v":v.id,onClick:()=>sv(v.id)});b.append(h("span",{style:{fontSize:"15px"}},v.ic)," "+v.l);nav.appendChild(b)});
(async()=>{try{await load();rOv()}catch(e){$("con").innerHTML=`<div class="cd" style="color:var(--rd)">Failed to load: ${e.message}</div>`}})();
</script>
</body>
</html>
