name: Dump primary-review nav structure
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/strip-methodology.yml'
permissions:
  contents: write
jobs:
  dump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Restore original and dump nav markup around each tab label
        run: |
          set -e
          SRC=dee9b8ca15680993beacc2dcaa494a233c85c2c1
          git show "$SRC:primary-review.html" > primary-review.html
          python3 - <<'PY'
          import re, pathlib
          t = pathlib.Path("primary-review.html").read_text(encoding="utf-8", errors="replace")
          out = ["size=%d" % len(t)]
          labels = ["Findings Explorer","Cascade Chains","Likely in AR","Human Review","Categories","Methodology","Summary"]
          for lab in labels:
              idxs = [m.start() for m in re.finditer(re.escape(lab), t)]
              out.append("\n=== %s : %d occurrence(s) at %s ===" % (lab, len(idxs), idxs[:10]))
              for i in idxs[:3]:
                  s = max(0, i-320); e = min(len(t), i+200)
                  out.append(t[s:e].replace(chr(10), "\\n"))
                  out.append("----")
          pathlib.Path("nav_dump.txt").write_text("\n".join(out), encoding="utf-8")
          print("\n".join(out)[:4000])
          PY
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add primary-review.html nav_dump.txt
          git commit -m "Restore original primary-review.html and dump nav structure for surgical Methodology-tab removal"
          git push
